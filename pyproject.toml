[project]
name = "gpt-from-scratch"
version = "0.1.0"
description = "A Llama-style GPT built from scratch in PyTorch: byte-level BPE tokenizer, RoPE, RMSNorm, SwiGLU, KV-cache sampling."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abbishekk DGS" }]
requires-python = ">=3.11"
dependencies = ["torch>=2.3", "numpy>=1.26"]

[project.urls]
Homepage = "https://abbishekkdgs.tech"
Repository = "https://github.com/Abbishekk-DGS/gpt-from-scratch"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gpt-from-scratch = "gpt_from_scratch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt_from_scratch"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

# CPU-only torch on Linux keeps CI fast; macOS uses the default (MPS-enabled) wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
